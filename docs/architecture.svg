<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger detailed application architecture</title>
  <desc id="desc">A detailed architecture diagram of the ShopLedger browser UI, Express server, four route modules, ten library modules, configuration, JSON storage, their dependencies, and the eight-step order placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      *{box-sizing:border-box} text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:15px;fill:#5b687b}.heading{font-size:18px;font-weight:700}.filename{font-size:15px;font-weight:700}.body{font-size:12.5px;fill:#405066}.small{font-size:11.5px;fill:#526176}.tiny{font-size:10.5px;fill:#607087}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:1.4}.ui{fill:#eff6ff;stroke:#93c5fd}.server{fill:#f5f3ff;stroke:#c4b5fd}.route{fill:#fff;stroke:#cbd5e1}.module{fill:#fff;stroke:#cbd5e1}.data{fill:#ecfdf5;stroke:#86efac}.config{fill:#fff7ed;stroke:#fdba74}.wire{fill:none;stroke:#94a3b8;stroke-width:1.6;marker-end:url(#arrow)}.wirePlain{fill:none;stroke:#a7b2c1;stroke-width:1.35}.flowline{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#blueArrow)}.badge{fill:#dbeafe}.badgeText{font-size:10px;font-weight:700;fill:#1d4ed8}.stepCircle{fill:#2563eb;stroke:#fff;stroke-width:2}.stepText{fill:#fff;font-size:14px;font-weight:750;text-anchor:middle;dominant-baseline:central}.flowCard{fill:#fff;stroke:#bfdbfe;stroke-width:1.4}.legend{font-size:11.5px;fill:#526176}
    </style>
  </defs>
  <rect width="1900" height="1320" fill="#f5f8fc"/>
  <text x="54" y="62" class="title">ShopLedger · Detailed Architecture</text>
  <text x="56" y="91" class="subtitle">Browser interface → Express routes → business logic → JSON file</text>
  <rect x="54" y="116" width="1792" height="700" rx="18" fill="#fff" stroke="#d8e0ea"/>

  <!-- Column labels -->
  <text x="78" y="156" class="heading">Browser &amp; app</text>
  <text x="374" y="156" class="heading">routes/ · API endpoints</text>
  <text x="824" y="156" class="heading">lib/ · business logic</text>
  <text x="1625" y="156" class="heading">Configuration &amp; data</text>

  <!-- Main architecture wiring, behind components -->
  <path class="wire" d="M200 336V370"/>
  <path class="wirePlain" d="M328 452H350V234"/>
  <path class="wire" d="M350 234H374"/>
  <path class="wire" d="M350 350H374"/>
  <path class="wire" d="M350 466H374"/>
  <path class="wire" d="M350 582H374"/>
  <path class="wire" d="M1446 394H1664V728H1680"/>

  <!-- UI -->
  <rect x="78" y="180" width="250" height="156" rx="13" class="panel ui"/>
  <text x="98" y="211" class="filename">ShopLedger UI</text>
  <text x="98" y="237" class="body">public/index.html</text>
  <text x="98" y="258" class="body">public/js/app.js</text>
  <text x="98" y="279" class="body">public/css/style.css</text>
  <line x1="98" y1="294" x2="306" y2="294" stroke="#bfdbfe"/>
  <text x="98" y="315" class="small">POS · Order History · Khata · Audit</text>
  <rect x="78" y="370" width="250" height="164" rx="13" class="panel server"/>
  <text x="98" y="401" class="filename">server.js</text>
  <text x="98" y="426" class="body">Express app · JSON request parsing</text>
  <text x="98" y="447" class="body">Serves public/ static files</text>
  <text x="98" y="468" class="body">Mounts four routers at /api</text>
  <line x1="98" y1="483" x2="306" y2="483" stroke="#ddd6fe"/>
  <text x="98" y="503" class="small">GET /orders/:id/invoice</text>
  <text x="98" y="520" class="tiny">store → orders → invoice.render</text>

  <!-- Routes and their actual module calls -->
  <rect x="374" y="180" width="414" height="108" rx="12" class="panel route"/>
  <rect x="390" y="194" width="72" height="22" rx="11" class="badge"/><text x="402" y="209" class="badgeText">ORDERS</text>
  <text x="473" y="210" class="filename">routes/orders.js</text>
  <text x="390" y="237" class="body">GET /orders · GET /orders/:id</text>
  <text x="390" y="256" class="body">POST /orders · POST /orders/:id/cancel</text>
  <text x="390" y="276" class="tiny">Calls store, inventory, pricing, coupons, orders, ledger</text>

  <rect x="374" y="296" width="414" height="108" rx="12" class="panel route"/>
  <rect x="390" y="310" width="76" height="22" rx="11" class="badge"/><text x="402" y="325" class="badgeText">PRODUCTS</text>
  <text x="477" y="326" class="filename">routes/products.js</text>
  <text x="390" y="353" class="body">GET /products · GET /coupons</text>
  <text x="390" y="373" class="tiny">Calls store, inventory, tax, coupons</text>
  <text x="390" y="392" class="tiny">Product search/category · sellable stock · GST slab</text>

  <rect x="374" y="412" width="414" height="108" rx="12" class="panel route"/>
  <rect x="390" y="426" width="85" height="22" rx="11" class="badge"/><text x="402" y="441" class="badgeText">CUSTOMERS</text>
  <text x="486" y="442" class="filename">routes/customers.js</text>
  <text x="390" y="469" class="body">GET /customers · POST /customers/:id/settle</text>
  <text x="390" y="489" class="tiny">Calls store and ledger</text>
  <text x="390" y="508" class="tiny">Lists balances/settlements · records payment</text>

  <rect x="374" y="528" width="414" height="108" rx="12" class="panel route"/>
  <rect x="390" y="542" width="72" height="22" rx="11" class="badge"/><text x="402" y="557" class="badgeText">REPORTS</text>
  <text x="473" y="558" class="filename">routes/reports.js</text>
  <text x="390" y="585" class="body">GET /reports/dashboard · GET /reports/gst-reconciliation</text>
  <text x="390" y="605" class="body">POST /pricing/preview · GET /admin/export</text>
  <text x="390" y="625" class="tiny">Calls config, store, reports, pricing, coupons</text>

  <!-- Library modules: every module in lib/ -->
  <rect x="824" y="180" width="198" height="132" rx="12" class="panel module"/>
  <text x="840" y="208" class="filename">inventory.js</text>
  <text x="840" y="231" class="body">find · sellable stock</text>
  <text x="840" y="250" class="body">check · reserve · release</text>
  <text x="840" y="280" class="tiny">Uses config defaults</text>

  <rect x="1036" y="180" width="198" height="132" rx="12" class="panel module"/>
  <text x="1052" y="208" class="filename">pricing.js</text>
  <text x="1052" y="231" class="body">subtotal · discount</text>
  <text x="1052" y="250" class="body">computeTotals · tax split</text>
  <text x="1052" y="280" class="tiny">Uses tax.js · coupons.js</text>

  <rect x="1248" y="180" width="198" height="132" rx="12" class="panel module"/>
  <text x="1264" y="208" class="filename">coupons.js</text>
  <text x="1264" y="231" class="body">normalize · validate</text>
  <text x="1264" y="250" class="body">discount · active list</text>
  <text x="1264" y="280" class="tiny">Uses config.coupons</text>

  <rect x="1460" y="180" width="198" height="132" rx="12" class="panel module"/>
  <text x="1476" y="208" class="filename">tax.js</text>
  <text x="1476" y="231" class="body">HSN GST rate lookup</text>
  <text x="1476" y="250" class="body">CGST / SGST split</text>
  <text x="1476" y="280" class="tiny">Uses config.tax</text>

  <rect x="824" y="328" width="198" height="132" rx="12" class="panel module"/>
  <text x="840" y="356" class="filename">orders.js</text>
  <text x="840" y="379" class="body">add · get · list · cancel</text>
  <text x="840" y="398" class="body">cancellation reversals</text>
  <text x="840" y="428" class="tiny">Uses dates · inventory · ledger</text>

  <rect x="1036" y="328" width="198" height="132" rx="12" class="panel module"/>
  <text x="1052" y="356" class="filename">ledger.js</text>
  <text x="1052" y="379" class="body">customers · Khata credit</text>
  <text x="1052" y="398" class="body">debit reversal · settlement</text>
  <text x="1052" y="428" class="tiny">Customer balance calculations</text>

  <rect x="1248" y="328" width="198" height="132" rx="12" class="panel module"/>
  <text x="1264" y="356" class="filename">store.js</text>
  <text x="1264" y="379" class="body">read · write db.json</text>
  <text x="1264" y="398" class="body">appendAudit</text>
  <text x="1264" y="428" class="tiny">Ensures data structure</text>

  <rect x="1460" y="328" width="198" height="132" rx="12" class="panel module"/>
  <text x="1476" y="356" class="filename">reports.js</text>
  <text x="1476" y="379" class="body">dashboard summary</text>
  <text x="1476" y="398" class="body">GST reconciliation</text>
  <text x="1476" y="428" class="tiny">Uses inventory · ledger · invoice</text>

  <rect x="824" y="476" width="198" height="132" rx="12" class="panel module"/>
  <text x="840" y="504" class="filename">invoice.js</text>
  <text x="840" y="527" class="body">invoice figures</text>
  <text x="840" y="546" class="body">HTML rendering</text>
  <text x="840" y="576" class="tiny">Uses config · coupon rules</text>

  <rect x="1036" y="476" width="198" height="132" rx="12" class="panel module"/>
  <text x="1052" y="504" class="filename">dates.js</text>
  <text x="1052" y="527" class="body">today · date normalization</text>
  <text x="1052" y="546" class="body">fiscal year</text>

  <!-- Config and persistent JSON data -->
  <rect x="1680" y="180" width="142" height="280" rx="12" class="panel config"/>
  <text x="1694" y="210" class="filename">config.js</text>
  <text x="1694" y="238" class="tiny">port</text>
  <text x="1694" y="258" class="tiny">shop details</text>
  <text x="1694" y="278" class="tiny">tax / HSN slabs</text>
  <text x="1694" y="298" class="tiny">inventory defaults</text>
  <text x="1694" y="318" class="tiny">coupon rules</text>
  <line x1="1694" y1="334" x2="1808" y2="334" stroke="#fed7aa"/>
  <text x="1694" y="356" class="tiny">Config consumers:</text>
  <text x="1694" y="374" class="tiny">server.js · routes/reports.js</text>
  <text x="1694" y="390" class="tiny">inventory.js · tax.js · coupons.js · invoice.js</text>

  <rect x="1680" y="650" width="142" height="156" rx="12" class="panel data"/>
  <text x="1694" y="681" class="filename">data/db.json</text>
  <text x="1694" y="709" class="tiny">products</text>
  <text x="1694" y="728" class="tiny">orders · customers</text>
  <text x="1694" y="747" class="tiny">settlements</text>
  <text x="1694" y="766" class="tiny">auditLog · ID counters</text>
  <text x="1694" y="791" class="tiny">Read/written by store.js</text>

  <!-- Dependency notes: exact source relationships -->
  <rect x="824" y="632" width="834" height="160" rx="12" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="844" y="660" class="filename">Connections</text>
  <text x="844" y="687" class="small">pricing.js → tax.js, coupons.js</text>
  <text x="844" y="710" class="small">orders.js → dates.js, inventory.js, ledger.js</text>
  <text x="844" y="733" class="small">reports.js → inventory.js, ledger.js, invoice.js</text>
  <text x="844" y="756" class="small">invoice.js → config.js, coupons.js · store.js → data/db.json</text>
  <text x="844" y="779" class="small">tax.js, coupons.js, inventory.js → config.js</text>

  <!-- Order flow -->
  <text x="56" y="868" class="heading">Placing an order</text>
  <text x="56" y="893" class="subtitle">POST /api/orders · request, validation, calculation, persistence, response</text>
  <path class="flowline" d="M264 1024H282"/><path class="flowline" d="M484 1024H502"/>
  <path class="flowline" d="M704 1024H722"/><path class="flowline" d="M924 1024H942"/>
  <path class="flowline" d="M1144 1024H1162"/><path class="flowline" d="M1364 1024H1382"/>
  <path class="flowline" d="M1584 1024H1602"/>

  <rect x="56" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="78" cy="954" r="14" class="stepCircle"/><text x="78" y="954" class="stepText">1</text>
  <text x="100" y="959" class="filename">UI submits</text>
  <text x="74" y="991" class="body">app.js sends items,</text><text x="74" y="1011" class="body">coupon, customer and</text><text x="74" y="1031" class="body">payment mode.</text>
  <text x="74" y="1086" class="tiny">POST /api/orders</text>

  <rect x="276" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="298" cy="954" r="14" class="stepCircle"/><text x="298" y="954" class="stepText">2</text>
  <text x="320" y="959" class="filename">Route resolves</text>
  <text x="294" y="991" class="body">orders route checks for</text><text x="294" y="1011" class="body">items and resolves each</text><text x="294" y="1031" class="body">product ID and quantity.</text>
  <text x="294" y="1086" class="tiny">routes/orders.js</text>

  <rect x="496" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="518" cy="954" r="14" class="stepCircle"/><text x="518" y="954" class="stepText">3</text>
  <text x="540" y="959" class="filename">Stock check</text>
  <text x="514" y="991" class="body">inventory.check verifies</text><text x="514" y="1011" class="body">that requested units are</text><text x="514" y="1031" class="body">sellable.</text>
  <text x="514" y="1086" class="tiny">lib/inventory.js</text>

  <rect x="716" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="738" cy="954" r="14" class="stepCircle"/><text x="738" y="954" class="stepText">4</text>
  <text x="760" y="959" class="filename">Calculate totals</text>
  <text x="734" y="991" class="body">pricing computes subtotal,</text><text x="734" y="1011" class="body">coupon discount, HSN GST,</text><text x="734" y="1031" class="body">CGST/SGST and total.</text>
  <text x="734" y="1086" class="tiny">pricing · coupons · tax</text>

  <rect x="936" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="958" cy="954" r="14" class="stepCircle"/><text x="958" y="954" class="stepText">5</text>
  <text x="980" y="959" class="filename">Khata check</text>
  <text x="954" y="991" class="body">For khata payment, ledger</text><text x="954" y="1011" class="body">checks the customer and</text><text x="954" y="1031" class="body">credit limit, then bills it.</text>
  <text x="954" y="1086" class="tiny">lib/ledger.js · conditional</text>

  <rect x="1156" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="1178" cy="954" r="14" class="stepCircle"/><text x="1178" y="954" class="stepText">6</text>
  <text x="1200" y="959" class="filename">Commit order</text>
  <text x="1174" y="991" class="body">Inventory reserves units;</text><text x="1174" y="1011" class="body">orders.add assigns ID and</text><text x="1174" y="1031" class="body">stores order details.</text>
  <text x="1174" y="1086" class="tiny">inventory.js · orders.js</text>

  <rect x="1376" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="1398" cy="954" r="14" class="stepCircle"/><text x="1398" y="954" class="stepText">7</text>
  <text x="1420" y="959" class="filename">Persist changes</text>
  <text x="1394" y="991" class="body">store adds audit entry</text><text x="1394" y="1011" class="body">and writes updated</text><text x="1394" y="1031" class="body">data/db.json.</text>
  <text x="1394" y="1086" class="tiny">lib/store.js</text>

  <rect x="1596" y="930" width="208" height="190" rx="13" class="flowCard"/>
  <circle cx="1618" cy="954" r="14" class="stepCircle"/><text x="1618" y="954" class="stepText">8</text>
  <text x="1640" y="959" class="filename">Return response</text>
  <text x="1614" y="991" class="body">API responds 201 with</text><text x="1614" y="1011" class="body">created order; UI clears</text><text x="1614" y="1031" class="body">cart and refreshes views.</text>
  <text x="1614" y="1086" class="tiny">routes/orders.js → app.js</text>

  <line x1="56" y1="1174" x2="1846" y2="1174" stroke="#d8e0ea"/>
  <text x="56" y="1203" class="legend">Arrows in the upper map show app wiring, data access, and module dependencies. The blue numbered sequence traces order placement.</text>
  <text x="56" y="1232" class="legend">Data is stored in data/db.json through lib/store.js.</text>
</svg>




